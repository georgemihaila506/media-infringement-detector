include classpath("application.conf")

# Mirrors the SQS layout in plan section 6.6.
queues {
  activity-tasks {
    defaultVisibilityTimeout = 1800 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "activity-tasks-dlq"
      maxReceiveCount = 3
    }
  }
  activity-tasks-dlq { }
  activity-results {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
  }
}
