# Local stand-ins for AWS (plan section 7.1). Ports bind to localhost only.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: infringement
      POSTGRES_PASSWORD: infringement
      POSTGRES_DB: infringement
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infringement"]
      interval: 5s
      retries: 10

  # S3 stand-in.
  # No -s3.config means any credentials are accepted; buckets are created on first upload.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=9000
    ports: ["127.0.0.1:9000:9000"]
    volumes: [seaweedfs:/data]

  elasticmq:
    image: softwaremill/elasticmq-native
    ports: ["127.0.0.1:9324:9324", "127.0.0.1:9325:9325"]
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  pgdata:
  seaweedfs:
